name: Publish Crates

# NOTE: `workflow_dispatch` must be run against the release TAG, not a branch.
# The publish steps below are intentionally NOT tag-gated (they are the whole
# job), so a branch dispatch would still publish — but the tag-format and
# version-match verification steps WOULD silently skip, publishing an
# unverified version. The "Require a tag ref" step makes that loud.
'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "::error::This workflow publishes a release and must run against a tag, not '${GITHUB_REF}'."
            echo "::error::Re-run it from the Actions tab, choose this workflow, click 'Run workflow', and select the TAG (not the branch) — or dispatch the API with {\"ref\": \"vX.Y.Z\"}."
            echo "::error::Running against a branch would publish without the tag-format and version-match verification."
            exit 1
          fi
          echo "Running against release tag ${GITHUB_REF_NAME}."
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Validate release tag format
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]

      - name: Verify crate versions match release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          core_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/ghostlink-core/Cargo.toml | head -1)"
          cli_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/ghost-link/Cargo.toml | head -1)"
          [[ "$core_version" == "$version" ]]
          [[ "$cli_version" == "$version" ]]

      - name: Require CARGO_REGISTRY_TOKEN
        shell: bash
        env:
          TOKEN_SET: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          if [[ "${TOKEN_SET}" != "true" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN repo secret is not set. Generate a token at https://crates.io/settings/tokens and add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      # ghostlink-core has no intra-workspace dependents to publish first;
      # ghost-link depends on it via a path+version requirement, so it must
      # already be live on crates.io at a matching version before ghost-link
      # can publish — hence the strict order and the sleep to give the
      # index a moment to catch up (crates.io publish isn't instantaneous
      # for a fresh `cargo publish` in the same dependent's build to see).
      - name: Publish ghostlink-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ghostlink-core

      - name: Wait for crates.io index to catch up
        run: sleep 30

      - name: Publish ghost-link
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ghost-link
